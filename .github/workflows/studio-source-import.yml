name: Temporary verified Studio source import
on:
  push:
    branches: [main]
    paths: ['.studio-import/READY.json']
permissions:
  contents: write
concurrency:
  group: studio-source-import
  cancel-in-progress: false
jobs:
  upload-verified-git-objects:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Verify archive and upload source objects without changing any branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_COMMIT: ${{ github.sha }}
        shell: python
        run: |
          import os, json, base64, hashlib, lzma, tarfile, io, time
          from pathlib import PurePosixPath
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError
          repo = os.environ['REPOSITORY']
          if repo != 'programador-powershell/scanner3d-platform':
              raise RuntimeError('Unexpected repository')
          prefix = 'https://api.github.com/repos/' + repo
          def api(path, data=None):
              payload = None if data is None else json.dumps(data).encode()
              req = Request(prefix + path, data=payload, headers={
                  'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
                  'Content-Type': 'application/json',
              })
              for attempt in range(3):
                  try:
                      with urlopen(req, timeout=90) as res:
                          return json.load(res)
                  except HTTPError as exc:
                      if attempt == 2 or exc.code not in (429, 500, 502, 503, 504):
                          raise
                      delay = min(120, max(5, int(exc.headers.get('Retry-After', '15'))))
                      time.sleep(delay)
          def read_file(path):
              result = api('/contents/' + path + '?ref=' + os.environ['SOURCE_COMMIT'])
              if result.get('encoding') != 'base64':
                  raise RuntimeError('Unexpected content encoding')
              return base64.b64decode(result['content'])
          ready = json.loads(read_file('.studio-import/READY.json'))
          expected_archive = 'cd61f7294e0a131b80bc8fb1fb10f0425af100dc690e91f2f6da0806c66fc907'
          expected_tree = 'e1d8e0c3f196e772d5af39798cd60ccc551c6b8a'
          if ready['archive_sha256'] != expected_archive or ready['tree_sha'] != expected_tree:
              raise RuntimeError('Unapproved archive')
          expected_parts = ['.studio-import/parts/%03d.b64' % n for n in range(27)]
          if ready['parts'] != expected_parts:
              raise RuntimeError('Unexpected part names')
          packed = b''.join(base64.b64decode(read_file(p).strip(), validate=True) for p in expected_parts)
          if len(packed) != 323336 or hashlib.sha256(packed).hexdigest() != expected_archive:
              raise RuntimeError('Archive integrity failure')
          raw = lzma.decompress(packed, memlimit=128 * 1024 * 1024)
          if len(raw) > 8 * 1024 * 1024:
              raise RuntimeError('Archive exceeds expected bound')
          files = {}
          with tarfile.open(fileobj=io.BytesIO(raw), mode='r:') as archive:
              for member in archive.getmembers():
                  p = PurePosixPath(member.name)
                  if (not member.isfile() or p.is_absolute() or '..' in p.parts or
                      '.git' in p.parts or member.name in files or member.size > 1024 * 1024):
                      raise RuntimeError('Unsafe archive member: ' + member.name)
                  files[member.name] = archive.extractfile(member).read()
          if len(files) != 129 or len(files) != ready['file_count']:
              raise RuntimeError('Unexpected file count')
          manifest = json.loads(files['MANIFEST.sha256.json'])['files']
          if set(manifest) != set(files) - {'MANIFEST.sha256.json'}:
              raise RuntimeError('Manifest coverage mismatch')
          for name, digest in manifest.items():
              if hashlib.sha256(files[name]).hexdigest() != digest:
                  raise RuntimeError('File hash mismatch: ' + name)
          entries = []
          for number, (name, content) in enumerate(sorted(files.items()), 1):
              result = api('/git/blobs', {'content': base64.b64encode(content).decode(), 'encoding': 'base64'})
              expected = hashlib.sha1(b'blob ' + str(len(content)).encode() + b'\0' + content).hexdigest()
              if result['sha'] != expected:
                  raise RuntimeError('Git blob mismatch: ' + name)
              entries.append({'path': name, 'mode': '100644', 'type': 'blob', 'sha': result['sha']})
              print('Verified %d/%d: %s' % (number, len(files), name), flush=True)
              time.sleep(1.2)
          tree = api('/git/trees', {'tree': entries})
          if tree['sha'] != expected_tree:
              raise RuntimeError('Git tree mismatch')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write('Verified source tree: `' + tree['sha'] + '`\n\n129 files uploaded. No branch reference was changed by this workflow.\n')
          print('VERIFIED_TREE=' + tree['sha'], flush=True)
